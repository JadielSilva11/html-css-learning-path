<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        h1{
            width: 400px;

            /* Borda e espessura da borda */
            border-width: 5px;
            border: solid;
            border-color: blueviolet;

            /* Shorthand para borda 
                border: 5px solid blueviolet;
            */

            /* Padding é o espaço entre o conteúdo e a borda da caixa */
            padding-left: 10px;
            padding-right: 10px;
            padding-top: 10px;
            padding-bottom: 10px;

            /* Shorthand para padding
                padding: 10px; se as medidas forem iguais
                padding: 10px 20px 30px 40px se as medidas forem diferentes
            */


            /* Espaço ao redor da borda */
            margin-top: 50px;
            margin-right: 50px;
            margin-bottom: 50px;
            margin-left: 50px;

            /* Shorthand para margem
                margin: 10px; se for tudo igual
                margin: 20px auto 30px auto; se for diferente
            */

            /* Shorthand para outline
                outline: 5px dashed blue;
            */

            /* Sombra da caixa */
            box-shadow: 4px 8px 10px 3px rgba(0, 0, 0, 0.438);
        }

        a{
            border: solid;
            border-width: 2px;
            border-color: green;

            padding-left: 3px;
            padding-right: 3px;
            padding-top: 3px;
            padding-bottom: 3px;

            margin-left: 5px;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixas Box-level</h1>
    <p>Parágrafos e títulos de alto nível são exemplos de Box-level.</p>
    <p>Mas <a href="#">Links</a> São exemplos de Inline-level</p>
</body>
</html>
