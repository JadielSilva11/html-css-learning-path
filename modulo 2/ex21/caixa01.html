<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        h1{
            width: 400px;

            /* Borda e espessura da borda */
            border: solid;
            border-width: 5px;

            /* Padding é o espaço entre o conteúdo e a borda da caixa */
            padding-left: 10px;
            padding-right: 10px;
            padding-top: 10px;
            padding-bottom: 10px;

            /* Espaço ao redor da borda */
            margin-bottom: 50px;
        }

        a{
            border: solid;
            border-width: 2px;
            border-color: green;

            padding-left: 3px;
            padding-right: 3px;
            padding-top: 3px;
            padding-bottom: 3px;

            margin-left: 5px;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixas Box-level</h1>
    <p>Parágrafos e títulos de alto nível são exemplos de Box-level.</p>
    <p>Mas <a href="#">Links</a> São exemplos de Inline-level</p>
</body>
</html>
