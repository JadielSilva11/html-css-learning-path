<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>

        /*
            #  = id
            .  = class
            :  = pseudo-class
            :: = pseudo-element
            >  = children
        */

        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Pseudo-classes */
        a{
            text-decoration: none;
            color: rgb(2, 115, 153);
        }

        a:visited{
            color: purple;
        }

        a:hover{
            text-decoration: underline;
            color: darkblue;
        }

        a:active{
            color: green;
        }

        /* Pseudo-elementos */
        a::after{
            content: ' [Link]';
            color: rgb(160, 160, 160);
        }

        a::before{
            content: '😜 ';
        }
        
    </style>
</head>
<body>
    <h1>Personalizando links</h1>

    <ul>
        <li><a href="https://github.com/JadielSilva11" target="_blank">Repositório GitHub</a></li>
        <li><a href="https://ge.globo.com" target="_blank">Site ge Globo</a></li>
        <li><a href="http://www.r7.com" target="_blank">Site da Record</a></li>
    </ul>
</body>
</html>
